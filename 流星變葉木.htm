流星變葉木是大戟科變葉木屬的常綠灌木或小喬木，為園藝栽培種與細葉系品種，
又名斑點葉變葉木或虎子斑變葉木。
其全株具毒性汁液，株高約1至2公尺，葉片厚實平滑。
